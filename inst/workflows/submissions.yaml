# Trigger for the engine's process-submissions workflow. Copy into .github/workflows/ of a
# challenge repository; set the schedule, and the engine version after @.
name: process-submissions

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read real data, write nothing (output kept as an artifact)'
        type: boolean
        default: false

concurrency:
  group: submissions
  cancel-in-progress: false

jobs:
  run:
    uses: eco4cast/challenge-ci/.github/workflows/_submissions.yaml@main
    with:
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
