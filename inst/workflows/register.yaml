# Trigger for the engine's register-forecast-repo workflow. Copy into
# .github/workflows/ of a challenge repository, together with the issue form
# (inst/issue_forms/register-forecast-repo.yml, to .github/ISSUE_TEMPLATE/); set
# the engine version after @.
# A contributor opens the form to register a GitHub repository; the workflow
# checks it and adds it to the registry named by submissions$repos$registry.
name: register-forecast-repo

on:
  issues:
    types: [opened, edited]

# Registrations commit to the same file, so they take turns.
concurrency:
  group: register-forecast-repo
  cancel-in-progress: false

jobs:
  run:
    if: contains(github.event.issue.labels.*.name, 'register-repo')
    permissions:
      contents: write
      issues: write
    uses: eco4cast/challenge-ci/.github/workflows/_register.yaml@main
