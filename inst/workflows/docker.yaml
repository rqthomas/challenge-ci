# Trigger for the engine's challenge-image workflow. Copy into .github/workflows/ of a
# challenge repository; set the schedule, and the engine version after @.
name: challenge-image

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read real data, write nothing (output kept as an artifact)'
        type: boolean
        default: false

concurrency:
  group: docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  run:
    uses: eco4cast/challenge-ci/.github/workflows/_docker.yaml@main
    with:
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
