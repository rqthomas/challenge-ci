project:
  type: website
  output-dir: docs
  # Only pages render; the challenge's Markdown and partials in _content/ are
  # pulled into pages, never rendered on their own.
  render:
    - "*.qmd"
  # The browser modules and the staged data are copied as they are.
  resources:
    - js/**
    - data/**

# The site title, URL and repository come from the challenge: render_dashboard()
# writes them to _challenge.yml, together with the header and footer.
metadata-files:
  - _challenge.yml

format:
  html:
    # No Bootstrap: the pages are styled by styles.css (see its tokens).
    theme: none
    css: styles.css
    page-layout: custom
    toc: false
    # Quarto's page extras (hover cards, anchors, copy buttons) are not used.
    anchor-sections: false
    code-copy: false
    citations-hover: false
    footnotes-hover: false
    include-in-header: _head.html
    include-before-body: _header.html
    include-after-body: _footer.html

editor: source
