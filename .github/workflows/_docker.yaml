# Build a challenge's own image layer (`challenge/Dockerfile`, starting FROM
# the engine's base image) and push it under the name in the challenge's
# ci$docker_image, plus a dated tag that is never overwritten.
#
# Reusable: a challenge repository calls it from a short trigger workflow (see
# inst/workflows/docker.yaml in the engine), with `secrets: inherit`. Pushing
# to Docker Hub needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; GHCR images use
# the built-in token.
name: challenge-image

on:
  workflow_call:
    inputs:
      dry_run:
        description: Build the image without pushing it.
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # yq is preinstalled on GitHub's Ubuntu runners.
      - name: Image names
        id: names
        run: |
          image=$(yq '.ci.docker_image' challenge_configuration.yaml)
          repo=${image%:*}
          {
            echo "registry=$(case "$repo" in ghcr.io/*) echo ghcr;; *) echo dockerhub;; esac)"
            echo "tags<<EOF"
            echo "${repo}:latest"
            echo "${repo}:$(date -u +%Y-%m-%d)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: steps.names.outputs.registry == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.names.outputs.registry == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: challenge
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.names.outputs.tags }}
          secrets: |
            github_pat=${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Healthcheck
        if: ${{ !inputs.dry_run }}
        run: |
          url=$(yq '.ci.healthchecks.docker // ""' challenge_configuration.yaml)
          if [ -n "$url" ]; then curl -m 10 --retry 5 "$url"; fi
