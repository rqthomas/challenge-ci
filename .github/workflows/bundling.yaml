# Append new forecast and summary parquet to each model's bundle.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read real data, write nothing to S3 (output kept as an artifact)'
        type: boolean
        default: false

name: bundling

# Never run two bundlers at once: both would read the same bundle and raw files,
# and one would overwrite the other's upload. Queue instead of cancelling, so a
# long backlog run is never killed midway.
concurrency:
  group: bundling
  cancel-in-progress: false

# A manual dry run writes nothing to S3, publishes nothing and pings no
# healthcheck (docs/operations.md). Scheduled runs have no inputs: real runs.
env:
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  DRY_RUN_DIR: dry-run

jobs:
  config:
    uses: ./.github/workflows/_config.yaml

  bundle:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ needs.config.outputs.image }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-challenge

      - name: Bundle forecasts
        run: Rscript inst/scripts/bundle.R forecasts

      # Summaries are bundled even if forecasts failed: they are independent.
      - name: Bundle summaries
        if: ${{ !cancelled() }}
        run: Rscript inst/scripts/bundle.R summaries

      - uses: ./.github/actions/healthcheck
        with:
          name: bundling
