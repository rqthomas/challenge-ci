# Validate new submissions and write them as parquet and summaries.
#
# Reusable: a challenge repository calls it from a short trigger workflow that
# holds the schedule (see inst/workflows/submissions.yaml in the engine), with
# `secrets: inherit`. Engine actions and workflows are referenced by full name;
# the release workflow rewrites eco4cast/challenge-ci@main to the release.
name: submissions

on:
  workflow_call:
    inputs:
      dry_run:
        description: Read real data but write nothing to S3, publish nothing and ping no healthcheck.
        type: boolean
        default: false

env:
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  DRY_RUN_DIR: dry-run

jobs:
  config:
    uses: rqthomas/challenge-ci/.github/workflows/_config.yaml@v0.1.0-rc.14

  submissions:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.config.outputs.image }}
      options: --memory 15120m
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_ACCESS_KEY_SUBMISSIONS }}
      AWS_SECRET_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_SECRET_ACCESS_KEY_SUBMISSIONS }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: rqthomas/challenge-ci/.github/actions/setup-challenge@v0.1.0-rc.14

      - name: Process submissions
        run: Rscript -e 'challengeci::run_stage()' submissions

      - name: Keep the dry-run output
        if: ${{ inputs.dry_run && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-submissions
          path: dry-run/
          retention-days: 7
          if-no-files-found: warn

      - uses: rqthomas/challenge-ci/.github/actions/healthcheck@v0.1.0-rc.14
        with:
          name: submissions
