on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read real data, write nothing to S3 (output kept as an artifact)'
        type: boolean
        default: false

name: dashboard

# Two runs would push competing commits to gh-pages.
concurrency:
  group: dashboard
  cancel-in-progress: false

# A manual dry run writes nothing to S3, publishes nothing and pings no
# healthcheck (docs/operations.md). Scheduled runs have no inputs: real runs.
env:
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  DRY_RUN_DIR: dry-run

jobs:
  config:
    uses: ./.github/workflows/_config.yaml

  dashboard:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    container:
      image: ${{ needs.config.outputs.image }}
    steps:
      - run: git config --system --add safe.directory '*'

      # Full history: the publish step checks out the gh-pages branch.
      - uses: actions/checkout@v6
        with:
           fetch-depth: 0
           set-safe-directory: '*'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.146

      # Queries the public buckets; writes dashboard/data/ and the site
      # settings (title, links) in dashboard/_challenge.yml.
      - name: Stage data
        run: Rscript inst/scripts/dashboard.R

      # Also writes the sitemap, from the config's challenge_url.
      - name: Render
        run: quarto render dashboard

      - name: Keep the dry-run output
        if: ${{ inputs.dry_run && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-dashboard
          path: dashboard/docs/
          retention-days: 7
          if-no-files-found: warn

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout gh-pages
          cp -r dashboard/docs/* .
          git add .
          git commit -a -m "update pages" || echo "nothing to commit"
          git push https://${GITHUB_PAT}:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}
          # Back to the code branch, for the healthcheck step.
          git checkout -

      - uses: ./.github/actions/healthcheck
        with:
          name: dashboard
