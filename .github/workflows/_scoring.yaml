# Score forecasts that have new observations.
#
# Reusable: a challenge repository calls it from a short trigger workflow that
# holds the schedule (see inst/workflows/scoring.yaml in the engine), with
# `secrets: inherit`. Engine actions and workflows are referenced by full name;
# the release workflow rewrites eco4cast/challenge-ci@main to the release.
name: scoring

on:
  workflow_call:
    inputs:
      dry_run:
        description: Read real data but write nothing to S3, publish nothing and ping no healthcheck.
        type: boolean
        default: false
      since:
        description: Score forecasts after this date (YYYY-MM-DD); empty for six months ago.
        type: string
        default: ''

env:
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  DRY_RUN_DIR: dry-run

jobs:
  config:
    uses: rqthomas/challenge-ci/.github/workflows/_config.yaml@v0.1.0-rc.4

  scoring:
    needs: config
    runs-on: ${{ needs.config.outputs.large_runner }}
    timeout-minutes: 180
    container:
      image: ${{ needs.config.outputs.image }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
      EFI_NRP_KEY: ${{ secrets.EFI_NRP_KEY }}
      EFI_NRP_SECRET: ${{ secrets.EFI_NRP_SECRET }}
      SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@v6

      - uses: rqthomas/challenge-ci/.github/actions/setup-challenge@v0.1.0-rc.4

      - name: Score forecasts
        run: Rscript -e 'challengeci::run_stage()' score $SINCE

      - uses: rqthomas/challenge-ci/.github/actions/healthcheck@v0.1.0-rc.4
        with:
          name: scoring
