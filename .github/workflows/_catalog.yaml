# Build the challenge's STAC catalog and model metadata, and commit the catalog
# to its catalog repository (catalog_config$catalog_repo) or to a branch of the
# challenge's own repository (catalog_config$catalog_branch).
#
# Reusable: a challenge repository calls it from a short trigger workflow (see
# inst/workflows/catalog.yaml in the engine), with `secrets: inherit` and
# `permissions: contents: write`. A catalog kept in a branch of the challenge's
# own repository is pushed with the built-in token. A catalog repository of its
# own needs the CATALOG_TOKEN secret: a token that can push to it.
name: catalog

on:
  workflow_call:
    inputs:
      dry_run:
        description: Read real data but write nothing to S3, push nothing and ping no healthcheck.
        type: boolean
        default: false

env:
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  DRY_RUN_DIR: dry-run

jobs:
  config:
    uses: eco4cast/challenge-ci/.github/workflows/_config.yaml@main

  catalog:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.config.outputs.image }}
      options: --memory 15120m
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - run: git config --system --add safe.directory '*'

      - uses: actions/checkout@v6

      - uses: eco4cast/challenge-ci/.github/actions/setup-challenge@main

      # The catalog is written to ../<catalog_config$catalog_path>, a clone of
      # catalog_config$catalog_repo (default: this repository) on the branch
      # catalog_config$catalog_branch (default: the repository's default branch).
      - name: Read the catalog settings
        run: |
          read_setting() {
            Rscript -e "cat(yaml::read_yaml('challenge_configuration.yaml')\$catalog_config\$$1)"
          }
          repo=$(read_setting catalog_repo)
          echo "CATALOG_REPO=${repo:-$GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "CATALOG_BRANCH=$(read_setting catalog_branch)" >> "$GITHUB_ENV"
          echo "CATALOG_DIR=../$(read_setting catalog_path)" >> "$GITHUB_ENV"

      - name: Clone the catalog repository
        uses: eco4cast/challenge-ci/.github/actions/catalog-clone@main
        with:
          repo: ${{ env.CATALOG_REPO }}
          branch: ${{ env.CATALOG_BRANCH }}
          dir: ${{ env.CATALOG_DIR }}

      - name: Build catalog and model metadata
        run: Rscript -e 'challengeci::run_stage()' catalog

      # CATALOG_TOKEN is only needed for a catalog repository of its own; a
      # branch of this repository is pushed with the built-in token.
      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        uses: eco4cast/challenge-ci/.github/actions/catalog-push@main
        with:
          repo: ${{ env.CATALOG_REPO }}
          branch: ${{ env.CATALOG_BRANCH }}
          dir: ${{ env.CATALOG_DIR }}
          token: ${{ secrets.CATALOG_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Keep the dry-run output
        if: ${{ inputs.dry_run && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-catalog
          path: dry-run/
          retention-days: 7
          if-no-files-found: warn

      - uses: eco4cast/challenge-ci/.github/actions/healthcheck@main
        with:
          name: catalog
