# Build the engine's base image (R, the engine's dependencies and the
# challengeci package itself) and push it to GHCR as
# ghcr.io/<owner>/challenge-ci:main, plus a dated tag that is never overwritten.
# Releases build their own version tag (release.yaml).
name: base-image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'DESCRIPTION'
      - 'R/**'
      - 'inst/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build the image without pushing it'
        type: boolean
        default: false

concurrency:
  group: base-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Image names
        id: names
        run: |
          repo=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          {
            echo "tags<<EOF"
            echo "${repo}:main"
            echo "${repo}:main-$(date -u +%Y-%m-%d)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.names.outputs.tags }}
          # Mounted only while the GitHub installs run (see Dockerfile).
          secrets: |
            github_pat=${{ secrets.GITHUB_TOKEN }}
