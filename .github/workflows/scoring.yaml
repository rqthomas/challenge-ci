# Score forecasts that have new observations.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read real data, write nothing to S3 (output kept as an artifact)'
        type: boolean
        default: false
      since:
        description: Score forecasts after this date (YYYY-MM-DD); empty for six months ago
        type: string
        default: ''

name: scoring

# Runs share the scratch folder and rewrite the bundled scores; never overlap.
concurrency:
  group: scoring
  cancel-in-progress: false

# A manual dry run writes nothing to S3, publishes nothing and pings no
# healthcheck (docs/operations.md). Scheduled runs have no inputs: real runs.
env:
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  DRY_RUN_DIR: dry-run

jobs:
  config:
    uses: ./.github/workflows/_config.yaml

  scoring:
    needs: config
    runs-on: ${{ needs.config.outputs.large_runner }}
    timeout-minutes: 180
    container:
      image: ${{ needs.config.outputs.image }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
      EFI_NRP_KEY: ${{ secrets.EFI_NRP_KEY }}
      EFI_NRP_SECRET: ${{ secrets.EFI_NRP_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-challenge

      - name: Score forecasts
        env:
          SINCE: ${{ inputs.since }}
        run: Rscript inst/scripts/score.R $SINCE

      - uses: ./.github/actions/healthcheck
        with:
          name: scoring
