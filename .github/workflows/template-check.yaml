# Dry-run every stage of the example challenge (challenge-template) with the
# engine code being changed: a pull request that breaks a real challenge fails
# here before it is released. Nightly runs also catch changes in the public
# data the template reads.
#
# Runs in the engine's base image from main (docker.yaml) and installs the
# checked-out package over the copy in the image. DRY_RUN=true: the stages read
# the template's real buckets and write only to dry-run/. The submissions stage
# needs the submissions key, so it is not run.
#
# The template keeps its bucket private (public_read: false), so reading it needs
# a key. Give this repository a READ-ONLY key for the template's bucket as the
# secrets TEMPLATE_S3_ACCESS_KEY_ID and TEMPLATE_S3_SECRET_ACCESS_KEY (a dry run
# never writes to S3, so nothing more is needed). Without them (a pull request from
# a fork has none) only the config check runs, and the run says so.
#
# TEMPLATE_REPO (repository variable) names the template repository; while the
# template is private (staging), TEMPLATE_TOKEN (secret) is a token that can
# read it.
name: template-check

on:
  pull_request:
    paths:
      - 'DESCRIPTION'
      - 'R/**'
      - 'inst/**'
      - '.github/workflows/template-check.yaml'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: template-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository }}:main
    env:
      DRY_RUN: 'true'
      DRY_RUN_DIR: dry-run
      # The engine reads the main store with these (see credentials in the config).
      S3_ACCESS_KEY_ID: ${{ secrets.TEMPLATE_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.TEMPLATE_S3_SECRET_ACCESS_KEY }}
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6
        with:
          path: engine

      - uses: actions/checkout@v6
        with:
          repository: ${{ vars.TEMPLATE_REPO || 'eco4cast/challenge-template' }}
          token: ${{ secrets.TEMPLATE_TOKEN || github.token }}
          path: template

      # The image is built from main, so a dependency added by this change may not be
      # in it yet: install what it lacks, then the engine itself.
      - name: Install the engine from this checkout
        working-directory: .
        run: |
          Rscript engine/.github/scripts/install-missing-deps.R engine
          R CMD INSTALL --no-test-load engine

      - name: check
        run: Rscript -e 'challengeci::run_stage()' check

      # The other stages read the template's bucket, which needs the key.
      - name: Is there a read key?
        id: key
        run: |
          if [ -n "$S3_ACCESS_KEY_ID" ] && [ -n "$S3_SECRET_ACCESS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No TEMPLATE_S3_ACCESS_KEY_ID / TEMPLATE_S3_SECRET_ACCESS_KEY, so only the config check ran. Add a read-only key for the template's bucket to run every stage."
          fi

      - name: targets
        if: steps.key.outputs.present == 'true'
        run: |
          scripts=$(Rscript -e 'cat(unlist(lapply(challengeci::read_config()$target_groups, `[[`, "targets_script")), sep = "\n")')
          for script in $scripts; do
            echo "::group::$script"
            Rscript "$script"
            echo "::endgroup::"
          done

      - name: baselines
        if: steps.key.outputs.present == 'true'
        run: Rscript -e 'challengeci::run_stage()' baselines daily

      - name: bundle
        if: steps.key.outputs.present == 'true'
        run: Rscript -e 'challengeci::run_stage()' bundle

      - name: score
        if: steps.key.outputs.present == 'true'
        run: Rscript -e 'challengeci::run_stage()' score

      - name: catalog
        if: steps.key.outputs.present == 'true'
        run: Rscript -e 'challengeci::run_stage()' catalog

      - name: dashboard
        if: steps.key.outputs.present == 'true'
        run: Rscript -e 'challengeci::run_stage()' dashboard site

      - name: Keep the dry-run output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: template-dry-run
          path: template/dry-run/
          retention-days: 7
          if-no-files-found: warn
