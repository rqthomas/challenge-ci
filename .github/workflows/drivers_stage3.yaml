# Download the GEFS pseudo-observations and extend stage 3. A manual run can
# rebuild stage 3 from all of the pseudo data.
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read real data, write nothing to S3 (output kept as an artifact)'
        type: boolean
        default: false
      rebuild:
        description: Rebuild stage 3 from all pseudo data (slow)
        type: boolean
        default: false

name: drivers-stage3

# Runs rewrite each site's stage 3 file; never overlap.
concurrency:
  group: drivers-stage3
  cancel-in-progress: false

# A manual dry run writes nothing to S3, publishes nothing and pings no
# healthcheck (docs/operations.md). Scheduled runs have no inputs: real runs.
env:
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  DRY_RUN_DIR: dry-run

jobs:
  config:
    uses: ./.github/workflows/_config.yaml

  drivers:
    needs: config
    runs-on: ${{ needs.config.outputs.large_runner }}
    timeout-minutes: ${{ inputs.rebuild && 1440 || 180 }}
    container:
      image: ${{ needs.config.outputs.image }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-challenge

      # gdalcubes and gefs4cast are installed in the image.
      - name: Download pseudo and update stage 3
        run: Rscript inst/scripts/drivers_stage3.R ${{ inputs.rebuild && 'rebuild' || '' }}

      - uses: ./.github/actions/healthcheck
        with:
          name: drivers-stage3
