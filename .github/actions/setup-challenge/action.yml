name: Set up a challenge job
description: >
  The steps every job needs before running an R entry point inside the
  challenge container: trust the checkout, install mc, and optionally refresh
  the CA certificates. Run after actions/checkout.

inputs:
  refresh-ca:
    description: Reinstall CA certificates (some NEON and PhenoCam hosts need it).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Trust the checkout
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Engine actions are referenced by full name: inside a workflow called from
    # a challenge repo, ./ paths point at the challenge's checkout. The release
    # workflow rewrites eco4cast/challenge-ci and @main to the released version.
    - uses: rqthomas/challenge-ci/.github/actions/install-mc@v0.1.0-rc.2

    - name: Refresh CA certificates
      if: inputs.refresh-ca == 'true'
      shell: bash
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates
        update-ca-certificates
